<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mad Libs</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <h1>Mad Libs Story Maker</h1>
    </header>

    <main>
        <form name="madLibForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age"
                   min="1" max="120" step="1" required>

            <label for="noun">Noun:</label>
            <input type="text" id="noun" name="noun" required>

            <label for="verb">Verb (base form):</label>
            <input type="text" id="verb" name="verb" required>

            <label for="place">Place:</label>
            <input type="text" id="place" name="place" required>

            <div class="buttons">
                <button type="submit">Create Story</button>
                <button type="reset">Restart</button>
            </div>
        </form>

        <section id="story-section" hidden>
            <h2>Your Story:</h2>
            <p id="story" aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p>Madlibs Midterm Project</p>
    </footer>
</body>
</html>
