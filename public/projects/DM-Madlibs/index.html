<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mad Libs</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="main.js" defer></script>
</head>

<body>

    <header>
        <h1>Mad Libs</h1>
    </header>

    <main>

        <form name="madlibs">

            <label for="noun">Noun:</label><br>
            <input type="text" name="noun" placeholder="enter a noun"><br>

            <label for="adjective">Adjective:</label><br>
            <input type="text" name="adjective" placeholder="enter an adjective"><br>

            <label for="verb">Verb:</label><br>
            <input type="text" name="verb" placeholder="enter a verb"><br>

            <label for="name">Name:</label><br>
            <input type="text" name="name" placeholder="enter a name"><br>

            <label for="age">Age:</label><br>
            <input type="number" name="age" placeholder="enter an age"><br>

            <input type="submit" name="submit" value="Submit">
            <input type="reset" name="reset" value="Reset">

        </form>

        <div id="output"></div>

    </main>

</body>

</html>
